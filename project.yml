# XcodeGen 工程描述文件：在任意 macOS 或 CI 上执行 `xcodegen generate` 即可得到 Xcode 工程。
# 不手写 .xcodeproj 是为了避免工程文件损坏，也方便后续加文件时不用改工程配置。
name: MorningBell
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 1 = 仅 iPhone（不含 iPad）。这样界面按手机尺寸设计即可。
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  MorningBell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: MorningBell
        PRODUCT_BUNDLE_IDENTIFIER: com.example.morningbell
        INFOPLIST_FILE: Support/Info.plist
        # 巨魔安装不需要签名，这里全部关掉，CI 才能在没有证书的环境里编译。
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        # 有图标才能正常显示，也能避免一部分系统层面的校验问题
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MorningBell:
    build:
      targets:
        MorningBell: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
