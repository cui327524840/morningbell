name: build-digest

on:
  schedule:
    # 每天 05:30（北京时间）生成，对应 UTC 前一天 21:30
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 离线自测（解析、打分、去重、输出格式）
        run: node tools/selftest.mjs

      - name: 生成每日时政要点
        env:
          # 可选：配了就用大模型把每条压成一句话简报（推荐 DeepSeek，几块钱能用很久）
          DIGEST_LLM_KEY: ${{ secrets.DIGEST_LLM_KEY }}
          DIGEST_LLM_BASE: ${{ vars.DIGEST_LLM_BASE }}
          DIGEST_LLM_MODEL: ${{ vars.DIGEST_LLM_MODEL }}
        run: node tools/build_digest.mjs --out-dir data

      - name: 提交回仓库
        run: |
          git config user.name "morningbell-bot"
          git config user.email "morningbell-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "内容没有变化，跳过提交"
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 上传要点 JSON（方便排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-json
          path: data/
          if-no-files-found: warn
